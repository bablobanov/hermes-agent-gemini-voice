name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (the engine contract test skips without a Hermes checkout)
        run: python -B -m unittest discover -s plugins/gemini-voice/tests -t plugins/gemini-voice/tests -v
